name: Smoke Test

on:
  pull_request:
  push:
    branches:
      - 'master'
  workflow_dispatch: 

jobs:
  test:
    name: Test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          # Java 8 is for running tests. Other version is for building the SDK.
          java-version: |
            8
            17
          cache: 'maven'
          
      - uses: docker/setup-docker-action@v5.7.0
        with:
          version: v28.5.1
          set-host: true

      - name: run package tests
        run: ./mvnw clean package

      - uses: actions/upload-artifact@v7
        with:
          name: junit-results
          path: '**/surefire-reports/**'
          retention-days: 7

      - name: Publish test results
        run: |
          curl https://raw.githubusercontent.com/couchbaselabs/junit-markdown/refs/heads/main/JunitMarkdown.java --output ${{ runner.temp }}/JunitMarkdown.java
          java ${{ runner.temp }}/JunitMarkdown.java . >> $GITHUB_STEP_SUMMARY
